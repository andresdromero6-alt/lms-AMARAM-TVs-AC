<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar o registrarme · AMARAM TV</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    .acceso { max-width: 440px; margin: 0 auto; }
    .boton-google { background: var(--superficie); color: var(--texto); border-color: var(--borde); }
    .boton-google:hover { background: var(--fondo); }
    .o-separador { display: flex; align-items: center; gap: var(--esp-3); color: var(--texto-tenue); font-size: var(--tam-xs); text-transform: uppercase; letter-spacing: 0.1em; }
    .o-separador::before, .o-separador::after { content: ""; flex: 1; border-top: 1px solid var(--borde); }
  </style>
</head>
<body>
  <header id="header"></header>
  <main>
    <section class="seccion">
      <div class="contenedor acceso">
        <div class="texto-centro mb-5">
          <span class="etiqueta-seccion">Tu cuenta</span>
          <h1 id="titulo-acceso">Entrar</h1>
          <p class="subtitulo" style="margin-inline:auto">Con tu cuenta accedes a los cursos que compres y guardas tu avance.</p>
        </div>

        <div class="tarjeta">
          <div class="pestanas" role="tablist">
            <button role="tab" aria-selected="true" id="tab-entrar" type="button">Entrar</button>
            <button role="tab" aria-selected="false" id="tab-registro" type="button">Crear cuenta</button>
          </div>

          <div id="mensaje-demo" class="mensaje mensaje--alerta mb-5" hidden>Modo demo: el inicio de sesión se activa cuando el equipo configura Firebase Authentication (ver <code>docs/firebase.md</code>).</div>

          <button class="boton boton--contorno boton--bloque boton-google mb-5" id="boton-google" type="button">
            <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.5l6.8-6.8C35.8 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.3l7.9 6.1C12.4 13.4 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.7 6c4.5-4.2 6.9-10.3 6.9-17.7z"/><path fill="#FBBC05" d="M10.5 28.6A14.5 14.5 0 0 1 9.7 24c0-1.6.3-3.1.8-4.6l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.7-6c-2.1 1.4-4.9 2.3-8.2 2.3-6.3 0-11.6-4-13.5-9.6l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
            Continuar con Google
          </button>
          <p class="o-separador mb-5">o con tu correo</p>

          <form class="formulario" id="form-entrar" novalidate>
            <div class="campo"><label for="correo-e">Correo</label><input id="correo-e" name="email" type="email" autocomplete="email" required></div>
            <div class="campo"><label for="clave-e">Contraseña</label><input id="clave-e" name="password" type="password" autocomplete="current-password" required minlength="6"></div>
            <button class="boton boton--primario boton--bloque" type="submit">Entrar</button>
            <button class="boton boton--fantasma boton--sm" type="button" id="boton-recuperar">Olvidé mi contraseña</button>
          </form>

          <form class="formulario" id="form-registro" hidden novalidate>
            <div class="campo"><label for="nombre-r">Nombre completo</label><input id="nombre-r" name="name" type="text" autocomplete="name" required minlength="3"></div>
            <div class="campo"><label for="correo-r">Correo</label><input id="correo-r" name="email" type="email" autocomplete="email" required></div>
            <div class="campo"><label for="clave-r">Contraseña</label><input id="clave-r" name="password" type="password" autocomplete="new-password" required minlength="6"><span class="ayuda">Mínimo 6 caracteres.</span></div>
            <div class="campo campo--casilla">
              <input id="consent-r" name="consent" type="checkbox" required>
              <label for="consent-r">Acepto los <a href="legales.html#terminos" target="_blank">términos y condiciones</a> y autorizo el tratamiento de mis datos según la <a href="legales.html" target="_blank">política de datos</a>.</label>
            </div>
            <button class="boton boton--primario boton--bloque" type="submit">Crear mi cuenta</button>
          </form>

          <div id="mensaje" class="mensaje mt-3" hidden></div>
        </div>
      </div>
    </section>
  </main>
  <footer id="footer"></footer>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
