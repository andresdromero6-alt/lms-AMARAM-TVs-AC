<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de cursos · AMARAM TV</title>
  <meta name="description" content="Todos los cursos de AMARAM TV: montaje profesional de Smart TVs e instalación de aires acondicionados Mini Split. Filtra por categoría y nivel.">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header id="header"></header>
  <main>
    <section class="seccion seccion--oscura seccion--compacta">
      <div class="contenedor">
        <span class="etiqueta-seccion">Catálogo</span>
        <h1>Todos los cursos</h1>
        <p class="subtitulo mb-0">Pago único, acceso inmediato y certificado al terminar. Elige por dónde empezar.</p>
      </div>
    </section>
    <section class="seccion">
      <div class="contenedor">
        <form class="fila mb-5" id="filtros" aria-label="Filtrar cursos" onsubmit="return false">
          <div class="campo">
            <label for="filtro-categoria">Categoría</label>
            <select id="filtro-categoria"><option value="">Todas</option></select>
          </div>
          <div class="campo">
            <label for="filtro-nivel">Nivel</label>
            <select id="filtro-nivel"><option value="">Todos</option></select>
          </div>
          <div class="campo" style="flex:1; min-width: 200px;">
            <label for="filtro-texto">Buscar</label>
            <input id="filtro-texto" type="search" placeholder="Smart TV, Mini Split, cobre…">
          </div>
        </form>
        <p class="texto-sm texto-suave" id="contador"></p>
        <div class="rejilla rejilla--3" id="lista-cursos"><div class="cargando">Cargando cursos…</div></div>
      </div>
    </section>
  </main>
  <footer id="footer"></footer>
  <script type="module" src="js/cursos.js"></script>
</body>
</html>
