<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi perfil · AMARAM TV</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    .avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--aguamarina); color: var(--azul-oscuro); display: grid; place-items: center; font-size: 1.8rem; font-weight: 700; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
  </style>
</head>
<body>
  <header id="header"></header>
  <main>
    <section class="seccion">
      <div class="contenedor">
        <div class="rejilla rejilla--2" style="grid-template-columns: 1fr; max-width: 820px;">
          <div class="tarjeta">
            <div class="fila mb-5"><div class="avatar" id="avatar"></div><div><h1 class="mb-0" id="nombre-vista">Mi perfil</h1><p class="texto-suave mb-0" id="correo-vista"></p><span class="insignia insignia--suave" id="rol-vista"></span></div></div>
            <form class="formulario" id="form-perfil">
              <div class="campo"><label for="nombre">Nombre completo</label><input id="nombre" name="name" type="text" required minlength="3"></div>
              <div class="campo"><label for="telefono">WhatsApp</label><input id="telefono" name="phone" type="tel" placeholder="300 000 0000"></div>
              <div class="fila"><button class="boton boton--primario" type="submit">Guardar cambios</button></div>
            </form>
          </div>

          <div class="tarjeta">
            <h2>Historial de compras</h2>
            <div class="tabla-envoltura"><table class="tabla"><thead><tr><th>Fecha</th><th>Curso</th><th class="num">Valor</th><th>Estado</th></tr></thead><tbody id="compras"><tr><td colspan="4" class="cargando">Cargando…</td></tr></tbody></table></div>
          </div>

          <div class="tarjeta">
            <h2>Certificados</h2>
            <p class="texto-sm texto-suave">Se habilitan al completar el 100 % de las lecciones de un curso.</p>
            <div id="certificados"></div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer id="footer"></footer>
  <script type="module" src="js/perfil.js"></script>
</body>
</html>
