<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aula · AMARAM TV</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header id="header"></header>
  <main>
    <section class="seccion seccion--compacta">
      <div class="contenedor">
        <p class="migas"><a href="mis-cursos.html">Mis cursos</a> › <span id="miga-curso">Curso</span></p>
        <div class="fila fila--entre mb-5">
          <div><h1 class="mb-0" id="titulo-curso">Cargando…</h1><p class="texto-sm texto-suave mb-0" id="resumen-avance"></p></div>
          <div style="min-width: 200px; flex: 0 1 260px;"><div class="progreso" aria-label="Avance del curso"><div class="progreso__barra" id="barra" style="width:0%"></div></div></div>
        </div>

        <div id="sin-acceso" hidden>
          <div class="vacio"><h3>Este contenido es para estudiantes inscritos</h3><p>Compra el curso para desbloquear todas las lecciones.</p><a class="boton boton--primario" id="enlace-comprar" href="cursos.html">Ver el curso</a></div>
        </div>

        <div class="aula" id="aula" hidden>
          <aside class="aula__lista" aria-label="Lecciones del curso"><h3>Contenido</h3><div id="lista-lecciones"></div></aside>
          <div>
            <p class="texto-xs texto-tenue mb-0" id="modulo"></p>
            <h2 id="titulo-leccion"></h2>
            <div class="video" id="video"></div>
            <div class="contenido-leccion" id="contenido"></div>
            <div class="fila mt-3" id="zona-material" hidden><a class="boton boton--contorno boton--sm" id="enlace-material" href="#" target="_blank" rel="noopener">⬇ Descargar material</a></div>
            <div class="aula__navegacion">
              <a class="boton boton--contorno" id="anterior" href="#">← Anterior</a>
              <button class="boton boton--primario" id="boton-completar" type="button">Marcar como completada</button>
              <a class="boton boton--contorno" id="siguiente" href="#">Siguiente →</a>
            </div>
            <div class="mensaje mensaje--exito mt-5" id="felicitacion" hidden>🎉 ¡Completaste el curso! Tu certificado quedará disponible en <a href="perfil.html">Mi perfil</a>.</div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer id="footer"></footer>
  <script type="module" src="js/leccion.js"></script>
</body>
</html>
